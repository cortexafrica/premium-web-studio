# Vérification continue du site en ligne.
#
# Un site vert le jour de la livraison ne l'est pas trois mois plus tard : une
# clé expire, un palier gratuit sature, un enregistrement DNS est modifié, un
# catalogue externe ferme. Sans ce fichier, c'est le client qui l'apprend — et
# pour une livraison vendue comme vérifiée, c'est le pire des échecs.
#
# À déposer dans le dépôt du client, sous .github/workflows/.
# Une seule valeur à changer : SITE_URL.

name: Vérification continue

on:
  schedule:
    # Lundi 6 h UTC. Assez tôt pour corriger avant que la semaine commence.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # pour ouvrir et refermer le constat, rien de plus

env:
  SITE_URL: https://exemple.com

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Contrôle de livraison
        id: livraison
        continue-on-error: true
        run: |
          python scripts/check_release.py "$SITE_URL" --market us \
            --out rapport | tee rapport-livraison.txt

      - name: Contrôle de sécurité
        id: securite
        continue-on-error: true
        run: |
          python scripts/check_security.py "$SITE_URL" \
            --out rapport | tee rapport-securite.txt

      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: rapport/
          retention-days: 90

      # Une issue plutôt qu'un e-mail : un e-mail de plus ne se lit pas, une
      # issue reste ouverte tant que le problème dure et se referme toute seule
      # quand il disparaît.
      - name: Ouvrir ou refermer le constat
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const casse = '${{ steps.livraison.outcome }}' === 'failure'
                       || '${{ steps.securite.outcome }}' === 'failure';
            const titre = 'Vérification continue : le site en ligne a régressé';

            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'verification-continue',
            });
            const existante = ouvertes.data.find(i => i.title === titre);

            if (!casse) {
              if (existante) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existante.number,
                  body: 'Les contrôles repassent au vert. Refermé automatiquement.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existante.number, state: 'closed',
                });
              }
              return;
            }

            const lire = (f) => {
              try { return fs.readFileSync(f, 'utf8').slice(-4000); }
              catch { return '(rapport indisponible)'; }
            };
            const corps = [
              `Contrôle du ${new Date().toISOString().slice(0, 10)} sur ${process.env.SITE_URL}.`,
              '', '### Livraison', '```', lire('rapport-livraison.txt'), '```',
              '', '### Sécurité', '```', lire('rapport-securite.txt'), '```',
            ].join('\n');

            if (existante) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existante.number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['verification-continue'],
              });
            }
